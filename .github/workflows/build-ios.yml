name: Build iOS (.ipa)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Método de build'
        required: true
        default: 'native'
        type: choice
        options:
          - 'native'
          - 'eas'
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-native:
    name: Build IPA (macOS Runner)
    if: "${{ github.event.inputs.build_mode != 'eas' }}"
    runs-on: macos-14
    env:
      EXPO_PUBLIC_API_URL: https://uc5-projeto-desktop-api.onrender.com

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências do Projeto
        run: npm ci

      - name: 🍏 Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 🛠️ Gerar Código Nativo iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compilar Arquivo .xcarchive (xcodebuild)
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/Ludora.xcworkspace \
            -scheme Ludora \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath ios/build/Ludora.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 📦 Empacotar como .ipa (Payload)
        run: |
          mkdir -p ios/build/Payload
          cp -R ios/build/Ludora.xcarchive/Products/Applications/Ludora.app ios/build/Payload/
          cd ios/build
          zip -r -y Ludora.ipa Payload
          echo "IPA gerado com sucesso em ios/build/Ludora.ipa"
          ls -lh Ludora.ipa

      - name: 📤 Publicar .ipa como Artefato do GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Ludora-iOS-v${{ github.ref_name }}
          path: ios/build/Ludora.ipa
          retention-days: 14

      - name: 🚀 Criar Release no GitHub (quando gerado via Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/Ludora.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-eas:
    name: Build via Expo EAS Cloud
    if: "${{ github.event.inputs.build_mode == 'eas' || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_mode == 'eas') }}"
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Instalar Dependências
        run: npm ci

      - name: 🚀 Configurar EAS CLI
        run: npm install -g eas-cli

      - name: ☁️ Executar EAS Build para iOS
        run: eas build --platform ios --profile productionios --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

